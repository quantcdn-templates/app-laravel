# Docker Compose Override for Local Development
#
# This override:
# 1. Runs /quant-entrypoint.d/ scripts on container startup (for testing)
# 2. Mounts local src directory for live development
# 3. Sets database environment variables for local MySQL container
#
# In production (Quant Cloud), the platform wrapper handles entrypoints automatically.

services:
  laravel:
    build: .
    # Override entrypoint for local dev to run /quant-entrypoint.d/ scripts
    # This allows testing the same initialization that runs in Quant Cloud
    entrypoint: ["docker-entrypoint-laravel.sh"]
    command: ["apache2-foreground"]
    ports:
      - "80:80"

    volumes:
      # Mount source code for live development
      - ./src:/var/www/html:cached
      # Mount dev PHP config to override production settings (zz- prefix ensures it loads last)
      - ./dev-php.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro

    environment:
      # Laravel Configuration
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=base64:5jF8+AWwTh5IhY39pPpfmV3JOqScvNQQniqCYiHfHvY=
      - APP_URL=http://localhost
      - LOG_CHANNEL=stderr
      - LOG_LEVEL=debug

      # Database Configuration
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=laravel
      - DB_USERNAME=laravel
      - DB_PASSWORD=laravel
      - DISABLE_DB_TLS=true

      # Cache Configuration
      - CACHE_DRIVER=file
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=sync

      # Mail Configuration (for local testing)
      - MAIL_MAILER=log
      - MAIL_FROM_ADDRESS=hello@example.com
      - MAIL_FROM_NAME="Laravel App"

  db:
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=laravel
      - MYSQL_USER=laravel
      - MYSQL_PASSWORD=laravel
    ports:
      # Expose MySQL port for local database clients
      - "3306:3306"
