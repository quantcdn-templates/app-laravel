; Development PHP Configuration
; This file is mounted in local development to disable OPcache
; and enable verbose error reporting for debugging.

; Disable OPcache in development
opcache.enable=0
opcache.enable_cli=0

; Enable error display for debugging
display_errors=On
display_startup_errors=On
error_reporting=E_ALL

; Increase memory for development
memory_limit=512M

; Increase execution time for debugging
max_execution_time=300
